<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
        }
        header {
            border-bottom: 1px solid #beb6b6;
        }
        header img {
            width: 200px;
            height: auto;
            display: block;
        }
        main {
            max-width: 400px;
            margin: 100px auto 0;
        }
        h1 {
            color: aliceblue;
            margin-bottom: 8px;
        }
        p {
            color: #beb6b6;
            margin-bottom: 16px;
        }
        input {
            width: 400px;
            height: 60px;
            padding: 6px 10px;
            background-color: #1c1516;
            color: #beb6b6;
            font-size: medium;
        }
        button{
            width: 400px;
            height: 60px;
            margin-top: 30px;
            background-color: #d4574e;
            font-size: large;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo">
    </header>

    <main>
        <h1>Enter your info to sign in</h1>
        <p>Or get started with a new account.</p>
        <form action="/dashboard.html">
        <input type="mail">
        <button type="submit">Continue</button>
        </form>
        <a href="/adminlogin.html" style="color: aliceblue;">Admin Login</a>
    </main>
</body>
</html>
